[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "iterative_stats"
version = "0.2.1"
description = "This package implements iterative algorithms to compute some basics statistics"
authors = ['Frederique Robin']
readme = "README.md"
license = "LICENSE" 
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
homepage = "https://github.com/your-username/iterative-stats"
repository = "https://github.com/your-username/iterative-stats"

[tool.poetry.dependencies]
python = ">=3.11"
pyyaml = ">=6.0"
numpy = ">=1.26.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=6.2.1"
autopep8 = "1.6.0"
openturns = ">=1.25,<2.0.0"
scipy = ">=1.16.1,<2.0.0"
mypy = ">=1.4.0,<2.0.0"
pyright = "^1.1.0"
ruff = ">=0.17.0"


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"


[tool.autopep8]
max_line_length = 120
ignore = "E501,W6"
in-place = true
recursive = true
aggressive = 3


[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true


[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["iterative_stats"]
exclude = ["**/node_modules", "**/__pycache__", "tests"]


[tool.ruff]
line-length = 120
target-version = "py311"
include = ["iterative_stats/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "F",     # Pyflakes - undefined names, unused imports
    "E",     # Pycodestyle - PEP8 errors
    "W",     # Pycodestyle - PEP8 warnings
    "I",     # isort - import sorting
    "N",     # pep8-naming - naming conventions
    "UP",    # pyupgrade - Python version-specific syntax
    "TRY",   # tryceratops - exception handling
    "ASYNC", # flake8-async - async/await issues
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "N802",   # Invalid function name (allow legacy camelCase)
    "N803",   # Invalid argument name (allow legacy convention)
    "N806",   # Variable in function with lowercase (allow legacy convention)
    "TRY002", # Create your own exception (legacy code uses Exception)
    "TRY003", # Avoid specifying long messages (legacy code pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["iterative_stats"]
known-third-party = ["numpy", "pyyaml"]

[tool.ruff.format]
quote-style = "double"
